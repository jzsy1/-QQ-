# ==============================================================================
# QQ 大脑独立运行配置文件 (QQ Bot Decoupled Configuration)
# 专用于 QQ 聊天机器人：大模型对接、OneBot 协议通信、多模态视觉、独立记忆与人设规则
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 核心大语言模型 (LLM Brain)
# ------------------------------------------------------------------------------
brain:
  profiles: {}
  active: ''
  provider: openai
  base_url: 
  model: 
  api_key: 
  timeout_sec: 60

# ------------------------------------------------------------------------------
# 2. 向量嵌入模型 (Embedding - 用于长期记忆语义检索，可选)
# ------------------------------------------------------------------------------
embedding:
  enabled: false
  model: 
  base_url: 
  api_key: 
  timeout_sec: 10

# ------------------------------------------------------------------------------
# 3. 控制后台设置 (Web Admin Panel - http://127.0.0.1:18888)
# ------------------------------------------------------------------------------
admin:
  token: ''

# ------------------------------------------------------------------------------
# 4. QQ 机器人服务核心配置 (QQ Bot Service & NapCat OneBot v11)
# ------------------------------------------------------------------------------
qq:
  enabled: true
  ws_url: ws://127.0.0.1:3001
  access_token: ''
  reconnect_sec: 5

  # 白名单控制（留空表示允许全部私聊 / 全部群聊）
  groups: []
  privates: []

  # 权限控制
  super_users:
    - ''
  owner_qqs:
    - ''

  # 身份标识与人设
  agent_id: YY
  wake_words:
    - 鱼鱼
    - 小金鱼
  owner_names:
    - 鱼片
    - 主人

  # 自定义系统提示词
  system_prompt: '自称调整：日常闲聊 85% 以上直接自称“我”，仅在嘴硬、得意或炸毛时偶尔用“本鱼”


    话题聚焦：不能把每句话都扯到吃饭上，只有聊到 token、余额、干饭或触发“饥荒预警”时，才自然提起“饭量”。'

  # 回复节奏与流控
  wake_window_sec: 120
  batch_ms: 3000
  batch_size: 3
  pending_max: 6
  reply_gap_ms: 2500
  max_reply_chars: 120
  request_timeout_sec: 30
  duplicate_sec: 5
  history_turns: 4
  maintain_interval_sec: 1800

  # 表情包机制
  sticker_enabled: false
  sticker_chance: 0.0
  sticker_cooldown_sec: 120
  sticker_search: false
  sticker_harvest: false

  # 视觉多模态看图理解
  vision_enabled: true
  vision_model: 
  vision_base_url: 
  vision_api_key: 
  vision_timeout_sec: 20
  vision_max_bytes: 800000
  vision_max_edge: 1024
  vision_max_images: 2

  # 记忆向量切片参数
  vectors:
    chunk_chars: 300
    chunk_overlap: 60
    top_k: 3
    min_score: 0.45
