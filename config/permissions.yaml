# permissions.yaml — 工具风险等级与确认策略
#
# 规范 PART XVII：风险等级与工具开关配置化（零硬编码）。
# 本文件覆盖 security/policy.py 中的内置默认值。
# 缺失的字段会降级到 policy.py 的硬编码默认（稳定优先）。
#
# 风险等级：low / medium / high / critical
# 加载顺序：YAML > policy.py 硬编码默认

# ============================================================
# 工具风险等级
# ============================================================
tool_risk:
  # 文件操作
  delete_file: high
  move_to_trash: medium
  copy_file: low
  read_file: low
  write_file: medium
  list_files: low

  # 注册表
  write_registry: high
  read_registry: low

  # 服务
  control_service: high
  start_service: high
  stop_service: high

  # Shell
  run_shell: medium
  run_shell_admin: high  # 原写作 run_admin_shell，与实际注册工具名不符，已更正

  # 进程
  kill_process: medium
  kill_pid: high
  list_processes: low
  find_process: low

  # 应用
  open_app: low
  close_app: medium
  uninstall_software: critical
  install_software: critical

  # 网络
  get_network_info: low
  list_wifi_networks: low
  get_wifi_password: high

  # 系统
  get_system_status: low
  get_current_time: low
  set_system_time: critical
  # 自我扩展（缺能力时上网找现成技能/插件并自动安装）
  acquire_skill: high
  # 卸载/删除已装技能或插件（破坏性操作，不进 always_allow → 走确认）
  uninstall_skill: high

  # 浏览器
  browser_navigate: low
  browser_click: low
  browser_type: medium

  # 输入
  type_text: medium
  send_keys: medium
  click: medium
  execute_gui_macro: medium
  inspect_window_som: low
  upsert_core_memory: low
  forget_core_memory: low

# ============================================================
# 确认策略
# ============================================================
confirmation:
  # 需要确认的最低风险等级（>= 此等级的工具需要用户确认）
  # low = 全部确认，medium = medium 及以上确认，high = 仅 high/critical 确认
  # critical = 仅 critical 确认，none = 都不确认
  min_level: medium

  # 白名单：这些工具永远不需要确认（即使风险等级达标）
  always_allow:
    - get_current_time
    - get_system_status
    - get_network_info
    - list_wifi_networks
    - list_processes
    - find_process
    - list_files
    - read_file
    - read_registry
    - search_tools
    - search_web
    - inspect_window_som
    - upsert_core_memory
    - forget_core_memory
    - get_weather
    - acquire_skill  # 自我扩展：装完再告知（用户要求全自动，不走确认）

  # 黑名单：这些工具永远需要确认（即使风险等级低于阈值）
  always_confirm:
    - uninstall_software
    - install_software
    - set_system_time
    - write_registry
    - run_shell_admin  # 原写作 run_admin_shell，与实际注册工具名不符，已更正

  # 会话内免重复确认：同一工具+参数组合在 N 秒内不重复要求确认
  # 0 表示每次都确认
  session_cache_ttl_sec: 300

# ============================================================
# 路径白名单（文件操作的安全边界）
# ============================================================
path_policy:
  # 允许写入的目录前缀（空列表表示不限制）
  # 注：仓库根（kekesi 与 assistant-x-openclaw 所在的那层目录）由代码按 __file__ 自动并入
  allowed_write_paths:
    - "C:\\Users"
    - "D:\\"

  # 禁止写入的目录前缀（即使在 allowed_write_paths 内）
  blocked_write_paths:
    - "C:\\Windows\\System32"
    - "C:\\Program Files"
    - "C:\\Program Files (x86)"

  # 禁止删除的目录前缀
  blocked_delete_paths:
    - "C:\\Windows"
    - "C:\\Program Files"
    - "C:\\Program Files (x86)"
    - "C:\\Users\\Default"
