# tools.yaml — 工具开关与超时配置
#
# 规范 PART XVII：工具开关配置化（零硬编码）。
# 与 config.yaml 的 tools 段互补：config.yaml 控制粗粒度开关，
# 本文件控制细粒度超时/限流/参数。
#
# 加载顺序：config.yaml > tools.yaml > 代码内默认值

# ============================================================
# 工具类别开关（粗粒度）
# ============================================================
enabled:
  app_control: true
  file_ops: true
  shell: true
  registry: true
  network: true
  process: true
  service: true
  input: true
  browser: true
  media: true
  system: true
  web_research: true

# ============================================================
# 工具超时（秒）
# ============================================================
timeout:
  shell: 30
  run_admin_shell: 60
  uninstall: 300
  install: 600
  app_control: 60
  close_app: 25
  kill_process: 15
  browser_navigate: 30
  browser_click: 10
  type_text: 10
  send_keys: 10
  get_network_info: 15
  list_wifi_networks: 20
  default: 60

# ============================================================
# 工具限流
# ============================================================
rate_limit:
  enabled: false
  # 每分钟最大调用次数（全局）
  max_calls_per_min: 60
  # 单工具每分钟最大调用次数
  per_tool:
    run_shell: 20
    browser_navigate: 30
    search_web: 30

# ============================================================
# 工具参数限制
# ============================================================
limits:
  # list_files 最大返回条数
  list_files_max: 500
  # list_processes 最大返回条数
  list_processes_max: 1000
  # search_web 最大结果数
  search_web_max_results: 10
  # type_text 单次最大字符数
  type_text_max_chars: 5000
  # run_shell 命令最大长度
  run_shell_max_cmd_length: 2000
